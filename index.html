<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JMO Vector Downloads</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101113;
      color: #f2f0ea;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    main { width: min(860px, 100%); }
    h1 { margin: 0 0 10px; font-size: clamp(34px, 7vw, 72px); line-height: .95; letter-spacing: 0; }
    p { color: #b8b3aa; font-size: 16px; line-height: 1.6; max-width: 680px; }
    .panel { border: 1px solid #2c2d30; background: #17191c; border-radius: 8px; padding: 18px; margin-top: 28px; }
    .meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: #d7d2c8; margin-bottom: 14px; }
    .version { color: #8fd7ff; font-weight: 700; }
    .downloads { display: grid; gap: 10px; }
    a.button { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 12px 14px; border: 1px solid #34363a; border-radius: 6px; color: #f7f4ed; text-decoration: none; background: #202327; }
    a.button:hover { border-color: #8fd7ff; background: #252a2f; }
    .size { color: #a59f95; font-size: 13px; white-space: nowrap; }
    .fallback { display: inline-flex; margin-top: 16px; color: #8fd7ff; }
    .muted { color: #8f887d; }
  </style>
</head>
<body>
  <main>
    <h1>JMO Vector</h1>
    <p>Vector graphics, illustration, and scalable artwork. This is a desktop app release page. Download an installer below or use JMO Launch for automatic updates.</p>
    <section class="panel">
      <div class="meta">
        <span>Latest release</span>
        <span id="version" class="version">Loading...</span>
      </div>
      <div id="downloads" class="downloads">
        <span class="muted">Fetching release assets...</span>
      </div>
      <a class="fallback" href="https://github.com/jvmisxn/jmo-vector-release-/releases">View all releases on GitHub</a>
    </section>
  </main>
  <script>
    const apiUrl = "https://api.github.com/repos/jvmisxn/jmo-vector-release-/releases/latest";
    const downloads = document.getElementById("downloads");
    const version = document.getElementById("version");
    const formatSize = bytes => {
      if (!bytes) return "";
      const units = ["B", "KB", "MB", "GB"];
      let size = bytes;
      let unit = 0;
      while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit++; }
      return size.toFixed(unit === 0 ? 0 : 1) + " " + units[unit];
    };
    fetch(apiUrl)
      .then(response => {
        if (!response.ok) throw new Error("No published release yet");
        return response.json();
      })
      .then(release => {
        version.textContent = release.tag_name || "Latest";
        const assets = (release.assets || []).filter(asset => !asset.name.toLowerCase().includes("checksum"));
        if (assets.length === 0) {
          downloads.innerHTML = '<span class="muted">No installer assets are attached to the latest release yet.</span>';
          return;
        }
        downloads.innerHTML = "";
        for (const asset of assets) {
          const link = document.createElement("a");
          link.className = "button";
          link.href = asset.browser_download_url;
          link.innerHTML = '<span>' + asset.name + '</span><span class="size">' + formatSize(asset.size) + '</span>';
          downloads.appendChild(link);
        }
      })
      .catch(error => {
        version.textContent = "Unavailable";
        downloads.innerHTML = '<span class="muted">' + error.message + '</span>';
      });
  </script>
</body>
</html>
